# Builds Sidepage for every platform and attaches the files to the GitHub release of the pushed tag.
#   Windows  .exe installer        macOS  .dmg (Apple silicon and Intel in one)
#   Linux    .AppImage and .deb    Android  .apk (test build)
# iPhone and iPad use the web app: an installable iOS build needs an Apple developer account to sign it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to, e.g. v0.4.0
        required: true
      only_android:
        description: Build only the Android APK
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  desktop:
    if: ${{ !inputs.only_android }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Sidepage ${{ env.TAG }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Linux machines already carry the Android SDK and NDK; Tauri only needs to be told where the NDK is.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Android project is generated fresh each time; nothing of it is kept in the repository.
      - run: npx tauri android init
      - run: npx tauri icon public/favicon.svg
      # A debug build is signed with Android's debug key, which is what lets it be installed for testing.
      - run: npx tauri android build --debug --apk --target aarch64 --target armv7
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find src-tauri/gen/android -name '*.apk' | head -1)
          cp "$apk" "Sidepage_${TAG#v}_android-test.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Sidepage $TAG" --notes ""
          gh release upload "$TAG" "Sidepage_${TAG#v}_android-test.apk" --clobber
