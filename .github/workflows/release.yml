# Builds Sidepage for every platform and attaches the files to the GitHub release of the pushed tag.
#   Windows  .exe installer        macOS  .dmg (Apple silicon and Intel in one)
#   Linux    .AppImage and .deb    Android  .apk
# Every build is signed: the desktop updates with the update key (the app checks them before installing), the
# Android app with Sidepage's own key, so each new version installs over the last one. Both keys are repository
# secrets; their owner keeps the originals.
# iPhone and iPad use the web app: an installable iOS build needs an Apple developer account to sign it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to, e.g. v0.4.0
        required: true
      only_android:
        description: Build only the Android APK
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  desktop:
    if: ${{ !inputs.only_android }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; tauri-action then writes latest.json, which installed copies check.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Sidepage ${{ env.TAG }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Linux machines already carry the Android SDK and NDK; Tauri only needs to be told where the NDK is.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Android project is generated fresh each time; nothing of it is kept in the repository.
      - run: npx tauri android init
      - run: npx tauri icon public/favicon.svg
      # Sidepage's own Android screen: keeps the app clear of the status bar, navigation bar and keyboard.
      - run: cp src-tauri/android/MainActivity.kt "$(find src-tauri/gen/android -name MainActivity.kt | head -1)"
      # Leave to use the microphone, for recording sound beside a note.
      - run: node scripts/android-manifest.mjs
      - run: npx tauri android build --apk --target aarch64 --target armv7
      # Android only installs signed apps, and installs a new version over the old one only when both carry the
      # same key: every build is signed with Sidepage's own key, kept as a repository secret.
      - name: Sign the APK and attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(find src-tauri/gen/android -name '*release*.apk' | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -z "$KEYSTORE" ]; then echo "The Android signing key is missing from the repository secrets." >&2; exit 1; fi
          echo "$KEYSTORE" | base64 -d > sidepage.jks
          "$tools/zipalign" -f 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks sidepage.jks --ks-key-alias sidepage --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "Sidepage_${TAG#v}_android.apk" aligned.apk
          rm sidepage.jks
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Sidepage $TAG" --notes ""
          gh release upload "$TAG" "Sidepage_${TAG#v}_android.apk" --clobber
