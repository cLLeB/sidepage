[package]
name = "sidepage"
version = "0.33.0"
description = "Read books, documents and slides with your notes alongside"
authors = ["cLLeB"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sidepage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

# On a computer, a second Sidepage (a file opened from Explorer) hands the file to the one already open.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Keep the installed app small.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
